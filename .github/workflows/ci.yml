name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10 can't resolve vitest's dependencies; see packageManager.
      - run: npx -y npm@11.21.0 ci
      - run: npm run typecheck
      - run: npm test
