<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ERC-CAL · Unlock Code Vault</title>
  <meta name="description" content="Look up the infotainment unlock codes you've stored for your own vehicles." />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2314b8a6' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='4' y='11' width='16' height='10' rx='2'/%3E%3Cpath d='M8 11V7a4 4 0 0 1 8 0v4'/%3E%3C/svg%3E" />
  <script src="/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-[#0b0f17] dark:text-slate-100 font-sans antialiased">
  <div class="mx-auto max-w-xl px-4 pb-16 pt-[max(1.25rem,env(safe-area-inset-top))]">

    <!-- Header -->
    <header class="flex items-center justify-between gap-3 py-4">
      <div class="flex items-center gap-3">
        <div class="grid h-10 w-10 place-items-center rounded-xl bg-accent-500/15 text-accent-600 dark:text-accent-400 ring-1 ring-accent-500/30">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-semibold leading-tight">ERC-CAL</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Your infotainment unlock code vault</p>
        </div>
      </div>
      <button id="themeToggle" type="button" aria-label="Toggle light/dark theme"
        class="grid h-10 w-10 place-items-center rounded-xl text-slate-500 hover:bg-slate-200/70 dark:text-slate-400 dark:hover:bg-white/5">
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <!-- Tabs -->
    <nav class="mb-5 grid grid-cols-2 rounded-xl bg-slate-200/70 p-1 text-sm font-medium dark:bg-white/5" role="tablist">
      <button type="button" role="tab" data-tab="find" aria-selected="true"
        class="tab rounded-lg px-3 py-2 transition">Find my code</button>
      <button type="button" role="tab" data-tab="save" aria-selected="false"
        class="tab rounded-lg px-3 py-2 transition">Save a code</button>
    </nav>

    <!-- Brand selector (shared by both tabs) -->
    <section aria-labelledby="brandHeading" class="mb-5">
      <h2 id="brandHeading" class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Brand</h2>
      <div id="brandGrid" class="grid grid-cols-3 gap-2 sm:grid-cols-6" role="radiogroup" aria-label="Vehicle brand">
        <!-- filled by app.js -->
        <div class="col-span-full h-[72px] animate-pulse rounded-xl bg-slate-200 dark:bg-white/5"></div>
      </div>
      <p id="brandsError" class="mt-2 hidden text-sm text-rose-600 dark:text-rose-400"></p>
    </section>

    <!-- Retrieval guide -->
    <details id="guide" class="group mb-5 rounded-xl border border-slate-200 bg-white dark:border-white/10 dark:bg-white/[0.03]">
      <summary class="flex cursor-pointer list-none items-center justify-between gap-3 px-4 py-3 text-sm font-medium">
        <span id="guideTitle">How to find your code</span>
        <svg class="h-4 w-4 shrink-0 text-slate-400 transition group-open:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="border-t border-slate-200 px-4 pb-4 pt-3 dark:border-white/10">
        <ol id="guideSteps" class="space-y-2.5 text-sm text-slate-600 dark:text-slate-300"></ol>
        <p id="guideNote" class="mt-4 hidden rounded-lg bg-amber-50 px-3 py-2 text-xs leading-relaxed text-amber-800 ring-1 ring-amber-200 dark:bg-amber-400/10 dark:text-amber-200 dark:ring-amber-400/20"></p>
      </div>
    </details>

    <!-- FIND panel -->
    <section id="panel-find" role="tabpanel">
      <form id="findForm" novalidate class="space-y-3">
        <div>
          <div class="mb-1.5 flex items-baseline justify-between">
            <label for="findIdentifier" id="findLabel" class="text-sm font-medium">Identifier</label>
            <span id="findCounter" class="font-mono text-xs text-slate-400"></span>
          </div>
          <input id="findIdentifier" name="identifier" autocomplete="off" autocapitalize="characters" spellcheck="false"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 font-mono text-base tracking-wider outline-none transition placeholder:text-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 dark:border-white/10 dark:bg-white/[0.04] dark:placeholder:text-slate-600"
            aria-describedby="findHint findError" />
          <p id="findHint" class="mt-1.5 text-xs text-slate-500 dark:text-slate-400"></p>
          <p id="findError" class="mt-1.5 hidden text-xs font-medium text-rose-600 dark:text-rose-400" role="alert"></p>
        </div>
        <button id="findSubmit" type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-accent-500 px-4 py-3 font-semibold text-white shadow-sm transition hover:bg-accent-600 disabled:cursor-not-allowed disabled:opacity-50 dark:text-slate-950">
          <span class="label">Find unlock code</span>
        </button>
      </form>

      <div id="result" class="mt-5" aria-live="polite"></div>
    </section>

    <!-- SAVE panel -->
    <section id="panel-save" role="tabpanel" class="hidden">
      <form id="saveForm" novalidate class="space-y-3">
        <div>
          <div class="mb-1.5 flex items-baseline justify-between">
            <label for="saveIdentifier" id="saveLabel" class="text-sm font-medium">Identifier</label>
            <span id="saveCounter" class="font-mono text-xs text-slate-400"></span>
          </div>
          <input id="saveIdentifier" autocomplete="off" autocapitalize="characters" spellcheck="false"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 font-mono text-base tracking-wider outline-none transition placeholder:text-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 dark:border-white/10 dark:bg-white/[0.04] dark:placeholder:text-slate-600"
            aria-describedby="saveHint saveIdError" />
          <p id="saveHint" class="mt-1.5 text-xs text-slate-500 dark:text-slate-400"></p>
          <p id="saveIdError" class="mt-1.5 hidden text-xs font-medium text-rose-600 dark:text-rose-400" role="alert"></p>
        </div>
        <div>
          <label for="saveCode" class="mb-1.5 block text-sm font-medium">Unlock code you were issued</label>
          <input id="saveCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="e.g. 1234"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 font-mono text-base tracking-wider outline-none transition placeholder:text-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 dark:border-white/10 dark:bg-white/[0.04] dark:placeholder:text-slate-600" />
          <p id="saveCodeError" class="mt-1.5 hidden text-xs font-medium text-rose-600 dark:text-rose-400" role="alert"></p>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-2">
            <label for="saveModel" class="mb-1.5 block text-sm font-medium">Model <span class="font-normal text-slate-400">(optional)</span></label>
            <input id="saveModel" maxlength="64" placeholder="e.g. Corolla"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-base outline-none transition placeholder:text-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 dark:border-white/10 dark:bg-white/[0.04] dark:placeholder:text-slate-600" />
          </div>
          <div>
            <label for="saveYear" class="mb-1.5 block text-sm font-medium">Year</label>
            <input id="saveYear" inputmode="numeric" maxlength="4" placeholder="2019"
              class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-base outline-none transition placeholder:text-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 dark:border-white/10 dark:bg-white/[0.04] dark:placeholder:text-slate-600" />
          </div>
        </div>
        <p id="saveYearError" class="hidden text-xs font-medium text-rose-600 dark:text-rose-400" role="alert"></p>
        <div>
          <label for="saveNotes" class="mb-1.5 block text-sm font-medium">Notes <span class="font-normal text-slate-400">(optional)</span></label>
          <textarea id="saveNotes" rows="2" maxlength="500" placeholder="Where the code came from, e.g. dealer invoice 2021"
            class="w-full resize-none rounded-xl border border-slate-300 bg-white px-4 py-3 text-base outline-none transition placeholder:text-slate-400 focus:border-accent-500 focus:ring-4 focus:ring-accent-500/15 dark:border-white/10 dark:bg-white/[0.04] dark:placeholder:text-slate-600"></textarea>
        </div>
        <button id="saveSubmit" type="submit"
          class="flex w-full items-center justify-center gap-2 rounded-xl bg-accent-500 px-4 py-3 font-semibold text-white shadow-sm transition hover:bg-accent-600 disabled:cursor-not-allowed disabled:opacity-50 dark:text-slate-950">
          <span class="label">Save code</span>
        </button>
      </form>
      <div id="saveResult" class="mt-5" aria-live="polite"></div>
    </section>

    <footer class="mt-10 text-center text-xs leading-relaxed text-slate-500 dark:text-slate-500">
      For your own vehicles. ERC-CAL stores and looks up codes you were issued.<br />
      It does not generate or calculate unlock codes.
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-[max(1.5rem,env(safe-area-inset-bottom))] z-50 flex justify-center px-4 opacity-0 transition-opacity duration-200">
    <div id="toastInner" class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-lg dark:bg-white dark:text-slate-900"></div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
