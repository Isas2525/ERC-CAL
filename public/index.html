<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tokyo Model Vault</title>
  <meta name="description" content="A private garage for the infotainment unlock codes of your own vehicles." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0d15" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="modulepreload" href="/js/app.js" />
</head>
<body class="min-h-screen bg-page font-sans text-ink antialiased">
  <a href="#view" id="skip" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-lg focus:bg-surface focus:px-4 focus:py-2">Skip to content</a>

  <header class="sticky top-0 z-30 border-b border-line bg-page/85 backdrop-blur supports-[backdrop-filter]:bg-page/70">
    <div class="mx-auto flex h-16 max-w-5xl items-center gap-3 px-4 pt-[env(safe-area-inset-top)] sm:px-6">
      <a href="#/" class="flex items-center gap-2.5 rounded-lg focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-accent-500/30">
        <img src="/logo.svg" alt="" class="h-8 w-8" width="32" height="32" />
        <span class="leading-tight">
          <span class="block text-[15px] font-semibold tracking-tight">Tokyo Model Vault</span>
          <span class="hidden text-xs text-muted sm:block">Infotainment unlock codes for your cars</span>
        </span>
      </a>
      <nav class="ml-auto flex items-center gap-1 text-sm font-medium" aria-label="Main">
        <a href="#/" data-nav="garage" class="rounded-lg px-3 py-2 text-muted hover:bg-hover hover:text-ink aria-[current=page]:bg-hover aria-[current=page]:text-ink">Garage</a>
        <a href="#/guides" data-nav="guides" class="rounded-lg px-3 py-2 text-muted hover:bg-hover hover:text-ink aria-[current=page]:bg-hover aria-[current=page]:text-ink">Guides</a>
        <button id="themeToggle" type="button" aria-label="Switch light or dark theme" class="grid h-9 w-9 place-items-center rounded-lg text-muted hover:bg-hover hover:text-ink">
          <svg class="h-[18px] w-[18px] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="hidden h-[18px] w-[18px] dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="view" tabindex="-1" class="mx-auto max-w-5xl px-4 pb-16 pt-6 outline-none sm:px-6 sm:pt-8">
    <div class="space-y-4" aria-hidden="true">
      <div class="h-8 w-48 animate-pulse rounded-lg bg-hover"></div>
      <div class="h-32 animate-pulse rounded-2xl bg-hover"></div>
    </div>
  </main>

  <footer class="mx-auto max-w-5xl px-4 pb-[max(2rem,env(safe-area-inset-bottom))] text-xs leading-relaxed text-muted sm:px-6">
    <div class="border-t border-line pt-6">
      For vehicles you own. Tokyo Model Vault keeps the codes a dealer or manufacturer issued to you,
      and shows you how to request them. It never generates or calculates unlock codes.
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed inset-x-0 bottom-[max(1.5rem,env(safe-area-inset-bottom))] z-50 flex translate-y-2 justify-center px-4 opacity-0 transition duration-200">
    <div class="rounded-full bg-ink px-4 py-2 text-sm font-medium text-page shadow-lg"></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
